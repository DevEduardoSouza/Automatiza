# Default log rotation for all services. Sem isto o driver json-file cresce
# sem limite — o log do worker chegou a 33GB num arquivo (driver default,
# sem rotacao), pressionando o disco da VPS. Cada servico fica limitado a
# max-size * max-file. Aplicado no proximo `docker compose up -d` (recria os
# containers para o novo driver valer).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# O worker emite muito mais log que os demais (fallbacks de envio, retries),
# entao recebe uma janela maior para preservar historico util de debug.
x-logging-worker: &worker-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "10"

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: automatiza-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-automatiza}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-automatiza}
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-automatiza} -d ${DB_NAME:-automatiza}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automatiza

  # =============================================================================
  # Redis (Cache & Queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: automatiza-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 8192mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automatiza

  # =============================================================================
  # WAHA Plus (WhatsApp API)
  # =============================================================================
  waha:
    # Pinned to an explicit version instead of the moving `:gows` tag so that a
    # `docker compose pull` never silently upgrades WAHA and triggers a one-way
    # migration of the on-disk GOWS session databases. Same image currently in
    # prod (digest sha256:6e66718b37f1...). Bump deliberately during maintenance.
    image: devlikeapro/waha-plus:gows-2026.6.2
    container_name: automatiza-waha
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_WORKER_MODE: GOWS
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # Phase 2: stagger the reconnect herd on restart (520 sessions no longer
      # all reconnect at once -> avoids the rate-limit/ban risk of a mass re-pair).
      WAHA_AUTO_START_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_URL: http://server:3000/api/v1/webhooks/waha
      # message.any (nao "message"): entrega TAMBEM as mensagens fromMe (posts
      # do proprio dono do chip). Necessario pro offer_generate repassar o post
      # que o dono faz no grupo de origem. Com "message" o WAHA/GOWS nao entrega
      # fromMe, e so ~1 de 360 sessoes recebia — quebrava offer_generate de
      # post-proprio em massa. message.any e superset de message (worker roteia
      # os dois igual, webhook_consumer_worker.go). NAO adicionar "message"
      # junto: duplicaria os incoming.
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,session.status,group.join,group.leave
      WHATSAPP_HOOK_HMAC_KEY: ${WEBHOOK_SECRET}
      WHATSAPP_FILES_LIFETIME: "600"
      WAHA_DASHBOARD_ENABLED: "false"
      # Phase 2: cut the ~5500 lines/min firehose (was info) — big CPU/IO relief.
      WAHA_LOG_LEVEL: warn
      WAHA_HTTP_LOG_LEVEL: warn
      WAHA_PRINT_QR: "False"
      # Phase 2: pure-Go DNS resolver — fixes 'lookup a.whatsapp.net: no such
      # host' seen under high concurrency with the default cgo resolver.
      GODEBUG: netdns=go
      # Phase 2: bound GOWS history sync so storage/CPU stay low after re-pair.
      WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT: "7"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: "30"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT: "100"
      # Phase 2: stop the 5s file-watcher polling over the session tree.
      CHOKIDAR_USEPOLLING: "0"
      # Phase 3: store media in S3 instead of on the shared disk. PROXY_FILES=True
      # keeps WAHA-hosted media URLs (backend-visible behaviour unchanged); flip
      # to False later (via .env) if you want to offload bandwidth to S3 directly.
      WAHA_MEDIA_STORAGE: ${WAHA_MEDIA_STORAGE:-S3}
      WAHA_S3_REGION: ${WAHA_S3_REGION}
      WAHA_S3_BUCKET: ${WAHA_S3_BUCKET}
      WAHA_S3_ACCESS_KEY_ID: ${WAHA_S3_ACCESS_KEY_ID}
      WAHA_S3_SECRET_ACCESS_KEY: ${WAHA_S3_SECRET_ACCESS_KEY}
      WAHA_S3_PROXY_FILES: ${WAHA_S3_PROXY_FILES:-True}
    # Phase 2: pin DNS resolvers (pairs with GODEBUG=netdns=go).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Phase 2: hard resource ceilings (was unbounded: 31GB RAM / 6254 FDs).
    mem_limit: 24g
    cpus: "12"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - waha_data:/app/.sessions
    ports:
      - "127.0.0.1:3001:3000"
    # Phase 2: dedicated tighter log rotation for the noisy WAHA container.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-Api-Key: '$$WHATSAPP_API_KEY http://localhost:3000/api/server/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - automatiza

  # =============================================================================
  # WAHA Plus — second shard (Phase 5). Mirror of `waha`, own volume + port.
  # New sessions are routed here by waha-router when waha-1 is over the cap.
  # =============================================================================
  waha-2:
    image: devlikeapro/waha-plus:gows-2026.6.2
    container_name: automatiza-waha-2
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_WORKER_MODE: GOWS
      WAHA_WORKER_ID: waha-2
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_AUTO_START_DELAY_SECONDS: "2"
      WHATSAPP_HOOK_URL: http://server:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message.any,message.ack,session.status,group.join,group.leave
      WHATSAPP_HOOK_HMAC_KEY: ${WEBHOOK_SECRET}
      WHATSAPP_FILES_LIFETIME: "600"
      WAHA_DASHBOARD_ENABLED: "false"
      WAHA_LOG_LEVEL: warn
      WAHA_HTTP_LOG_LEVEL: warn
      WAHA_PRINT_QR: "False"
      GODEBUG: netdns=go
      WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT: "7"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: "30"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT: "100"
      CHOKIDAR_USEPOLLING: "0"
      WAHA_MEDIA_STORAGE: ${WAHA_MEDIA_STORAGE:-S3}
      WAHA_S3_REGION: ${WAHA_S3_REGION}
      WAHA_S3_BUCKET: ${WAHA_S3_BUCKET}
      WAHA_S3_ACCESS_KEY_ID: ${WAHA_S3_ACCESS_KEY_ID}
      WAHA_S3_SECRET_ACCESS_KEY: ${WAHA_S3_SECRET_ACCESS_KEY}
      WAHA_S3_PROXY_FILES: ${WAHA_S3_PROXY_FILES:-True}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 24g
    cpus: "12"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - waha2_data:/app/.sessions
    ports:
      - "127.0.0.1:3002:3000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-Api-Key: '$$WHATSAPP_API_KEY http://localhost:3000/api/server/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - automatiza

  # =============================================================================
  # waha-router (Phase 5) — routes session->instance, merges the session list,
  # and BLOCKS DELETE/logout of a paired session without X-Confirm-Unpair:true
  # (structural anti-destruction). Backend points WAHA_API_URL here.
  # Emergency bypass: set WAHA_API_URL back to http://waha:3000 on server+worker.
  # =============================================================================
  waha-router:
    build: ./waha-router
    image: waha-router:local
    container_name: automatiza-waha-router
    restart: unless-stopped
    environment:
      WAHA_UPSTREAMS: "waha-1=http://waha:3000,waha-2=http://waha-2:3000"
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_CAP: "367"
      # Anti-ban (Layer 4A): route every NEW session pairing through a rotating
      # residential/ISP proxy so sessions never egress on the bare Hetzner
      # datacenter IP (which WhatsApp distrusts). Provide a comma-separated pool
      # of "server;username;password" entries in .env as WAHA_SESSION_PROXIES.
      # Empty/unset => injectProxy no-ops (sessions pair on the host IP), so set
      # this in production. The proxy is bound at pairing and sticky per session.
      WAHA_SESSION_PROXIES: ${WAHA_SESSION_PROXIES:-}
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - waha
      - waha-2
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/router/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - automatiza

  # =============================================================================
  # Database Migrations (run on-demand via `docker compose run migrate`)
  # =============================================================================
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/deveduardosouza/automatiza/backend:latest}
    container_name: automatiza-migrate
    profiles: ["tools"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "=== Running init.sql ==="
        PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME -f /app/db/init.sql
        echo "=== Running migrations ==="
        DB_HOST=postgres /app/db/run-migrations.sh
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-automatiza}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-automatiza}
      - PGPASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - automatiza

  # =============================================================================
  # Backend Server
  # =============================================================================
  server:
    image: ${BACKEND_IMAGE:-ghcr.io/deveduardosouza/automatiza/backend:latest}
    container_name: automatiza-server
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # Docker networking overrides (not in .env)
      - DB_HOST=postgres
      - DB_PORT=5432
      - CACHE_REDIS_URI=redis://redis:6379/0
      - WAHA_API_URL=http://waha-router:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automatiza
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =============================================================================
  # Background Worker
  # =============================================================================
  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/deveduardosouza/automatiza/backend:latest}
    container_name: automatiza-worker
    restart: unless-stopped
    logging: *worker-logging
    command: ["./server", "--worker"]
    env_file: .env
    environment:
      # Docker networking overrides (not in .env)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_MAX_CONNS=10
      - CACHE_REDIS_URI=redis://redis:6379/0
      - WAHA_API_URL=http://waha-router:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - automatiza

  # =============================================================================
  # Frontend (nginx SPA)
  # =============================================================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/deveduardosouza/automatiza/frontend:latest}
    container_name: automatiza-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - automatiza

volumes:
  postgres_data:
    name: docker_postgres_data
  redis_data:
    name: docker_redis_data
  waha_data:
    name: docker_waha_data
  waha2_data:
    name: docker_waha2_data

networks:
  automatiza:
    driver: bridge
