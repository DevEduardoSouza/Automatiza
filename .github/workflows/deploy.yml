name: Deploy

on:
  push:
    branches: [main]
    # Governance-only pushes do not produce a different runtime artifact.
    paths-ignore:
      - "**.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "Makefile"
      - "scripts/validate-change-governance.sh"
      - "scripts/test-validate-change-governance.sh"
      # Operação da VPS: nada aqui entra em imagem nem é copiado pelo deploy
      # (o CI só faz scp de docker-compose.prod.yml e docker/waha-router/*.go).
      # Instalação é manual por operador — um push aqui não deve bouncar containers.
      - "ops/**"
      - "systemd/**"
      - "observability/**"
      - "docker/postgres-backup/**"
      - "docker/docker-compose.backup.yml"
      - "docker/docker-compose.restore.yml"
      - "docker/docker-compose.restore-pitr.yml"
  workflow_dispatch:
    inputs:
      full_restart:
        description: "Full restart: down + up of the ENTIRE stack (recreates WAHA/postgres/redis — slow, reconnects all WhatsApp sessions). Leave off for normal rolling deploys."
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/deveduardosouza/automatiza
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  # Gate real do fluxo push-to-main: o CI (ci.yml) não roda em push na main,
  # então este job valida migrações novas e change records ANTES de o deploy
  # tocar a VPS. Os builds seguem em paralelo; só o job `deploy` espera.
  governance:
    name: Production Change Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test validator
        run: ./scripts/test-validate-change-governance.sh

      - name: Test migration runner on PostgreSQL 16
        run: ./automatiza-go/scripts/db/test-run-migrations.sh

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            ./scripts/validate-change-governance.sh --base "$BASE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            ./scripts/validate-change-governance.sh --base HEAD^
          else
            ./scripts/validate-change-governance.sh
          fi

  # ---------------------------------------------------------------------------
  # Both binaries are compiled ON THE RUNNER, where incremental caches persist
  # across runs (Go build cache, node_modules). The Docker builds then only
  # PACKAGE the artifacts: the Dockerfiles' `builder` stages are swapped out via
  # BuildKit named contexts (--build-context builder=<dir>), so the Dockerfiles
  # stay canonical for local builds and CI never compiles inside Docker.
  #
  # The deploy job does NOT `needs:` these jobs — it runs in parallel and polls
  # GHCR for the pushed tags, so the VPS prep work overlaps the builds and the
  # whole run finishes in ~build time + ~30s.
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to the same ref cancels this build: never spend minutes
    # building a commit that is already superseded.
    concurrency:
      group: deploy-build-backend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatiza-go

      - name: Generate version
        id: version
        # Commit-derived (committer date + SHA), NOT wall clock: the build jobs
        # and the deploy job agree on the tag without coordination, and a
        # re-deploy of the same commit is idempotent and fully cache-hot.
        run: echo "version=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Built-in cache only refreshes when go.sum changes; the explicit
          # caches below refresh every run for near-HEAD incremental compiles.
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('automatiza-go/go.sum') }}

      - name: Compute cache epoch
        id: epoch
        # The go-build cache grows ~10MB per deploy (stale entries pile up:
        # 460MB -> 556MB in a single day of deploys) and its restore was taking
        # 23s. Rotating the key weekly caps the growth; the first deploy of the
        # week compiles cold once, every later deploy restores a lean cache.
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gocache-${{ runner.os }}-go${{ env.GO_VERSION }}-w${{ steps.epoch.outputs.week }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-go${{ env.GO_VERSION }}-w${{ steps.epoch.outputs.week }}-

      - name: Build backend binary
        working-directory: automatiza-go
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Same flags as the Dockerfile builder stage; the binary lands outside
        # the repo so the Docker context stays untouched.
        run: |
          mkdir -p "$RUNNER_TEMP/go-ctx"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.Version=${VERSION}" \
            -o "$RUNNER_TEMP/go-ctx/server" ./cmd/server

      # Guard do INSERT de automações: em 23/07 uma coluna nova entrou na query
      # sem o valor correspondente e o build passou — a criação de automação só
      # quebrou no clique do usuário, em produção. Teste puro (sem banco, sem
      # Docker, ~0.5s). Se reprovar, a imagem não sobe e o job `deploy` aborta
      # no "Wait for images". Filtro por -run de propósito: o resto da suíte
      # deste pacote é de integração e exige Docker.
      - name: Guard de argumentos do INSERT de automações
        working-directory: automatiza-go
        run: go test ./internal/repository/postgres/ -run TestCreateAutomationArgs -count=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & push backend image
        uses: docker/build-push-action@v6
        with:
          context: automatiza-go
          # Replaces the Dockerfile's `builder` stage: COPY --from=builder
          # resolves against this directory, so the Go toolchain stage is
          # skipped entirely and only the runtime stage is built (cached).
          build-contexts: |
            builder=${{ runner.temp }}/go-ctx
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-build-frontend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # client/proto is a symlink to ../proto — both are required for
          # buf generate to resolve.
          sparse-checkout: |
            client
            proto

      - name: Generate version
        id: version
        run: echo "version=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules directly (not just ~/.npm): on a lockfile hit we skip
      # `npm ci` entirely — and the same deps serve buf generate AND the Vite
      # build below, so nothing is installed twice.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci --prefer-offline --no-audit --no-fund

      # Proto stubs only change when the protos (or the generator toolchain)
      # change — cache them and skip the ~15s buf generate on the common
      # code-only deploy.
      - name: Cache generated proto stubs
        id: proto-stubs
        uses: actions/cache@v4
        with:
          path: client/src/gen
          key: proto-gen-${{ hashFiles('proto/**', 'client/buf.gen.yaml', 'client/package-lock.json') }}

      - name: Generate Proto Stubs
        if: steps.proto-stubs.outputs.cache-hit != 'true'
        working-directory: client
        # buf comes from node_modules (@bufbuild/buf, pinned by the lockfile).
        run: npx buf generate

      - name: Build frontend (Vite + Sentry sourcemaps)
        working-directory: client
        # Same env the Dockerfile builder stage received as ARGs — Vite inlines
        # VITE_* at build time and the Sentry plugin uploads sourcemaps.
        env:
          SENTRY_ORG: automatiza
          SENTRY_PROJECT: automatiza-frontend
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ steps.version.outputs.version }}
          # KILL SWITCH do PWA: setar a variável PWA_SELF_DESTROY (gh variable set
          # PWA_SELF_DESTROY -b 1) + redeploy gera um sw.js no-op auto-destrutivo.
          # Ausente/vazia = service worker normal.
          PWA_SELF_DESTROY: ${{ vars.PWA_SELF_DESTROY }}
        run: npm run build

      - name: Stage dist for image packaging
        # The Dockerfile does COPY --from=builder /app/dist — mirror that path
        # inside the replacement context.
        run: |
          mkdir -p "$RUNNER_TEMP/fe-ctx/app"
          cp -R client/dist "$RUNNER_TEMP/fe-ctx/app/dist"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: client
          build-contexts: |
            builder=${{ runner.temp }}/fe-ctx
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Runs IN PARALLEL with the builds (no `needs:`). Everything that does not
  # depend on the new images happens while they compile: shipping compose +
  # waha-router source, building the router image, registry logins, base-image
  # pulls. Then it waits for the image tags to appear on GHCR (aborting fast if
  # a build job fails) and only THEN touches the stack — so a broken build
  # leaves production completely untouched.
  #
  # Serialized via the deploy-production concurrency group: two runs never
  # interleave compose commands on the VPS.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Guardrails de governança bloqueiam o rollout antes de qualquer mutação
    # na VPS; os builds continuam em paralelo (o deploy espera imagens via
    # poll no GHCR de qualquer forma).
    needs: governance
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      - name: Generate version
        id: version
        # Same commit-derived formula as the build jobs — no cross-job
        # coordination needed to agree on the tag.
        run: echo "version=$(git log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ControlMaster: every ssh/scp below reuses ONE authenticated TCP
          # connection instead of paying a full handshake per command.
          cat >> ~/.ssh/config << 'EOF'
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 10m
            ServerAliveInterval 15
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare VPS (compose + router + base images)
        run: |
          # waha-router is built ON the VPS (compose `build: ./waha-router`), so its
          # source must be present there. Ship the latest code (session sharding +
          # QR-fix path resolver + anti-unpair guard) so the build below rebuilds it.
          ssh vps 'mkdir -p /opt/automatiza/docker/waha-router'
          scp docker/docker-compose.prod.yml vps:/opt/automatiza/docker/docker-compose.yml
          # Ship ALL router .go sources (main.go + health.go + metrics.go + tests)
          # plus go.mod/Dockerfile. The Dockerfile does `COPY *.go .` and builds the
          # package, so every source file must be present on the VPS.
          scp docker/waha-router/*.go \
            docker/waha-router/go.mod \
            docker/waha-router/Dockerfile \
            vps:/opt/automatiza/docker/waha-router/
          ssh vps "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u devlikeapro --password-stdin 2>/dev/null" || {
            echo "WARNING: Docker Hub login failed — clearing bad credentials to allow public image pulls"
            ssh vps "docker logout 2>/dev/null" || true
          }
          # Router build (CPU-bound, cached when source unchanged) overlaps the
          # base-image pulls (network-bound). If the router build fails we abort
          # the run HERE, while the old stack is still fully up.
          ssh vps bash -s << 'SCRIPT'
          set -e
          cd /opt/automatiza/docker
          docker compose build waha-router &
          ROUTER_BUILD=$!
          # Pinned tags that are almost always already present — best-effort.
          docker compose pull -q postgres redis || echo "WARNING: postgres/redis pull failed (using cached images)"
          docker compose pull -q waha waha-2 || echo "WARNING: WAHA pull failed (using cached image)"
          wait "$ROUTER_BUILD"
          echo "Router image ready."
          SCRIPT

      - name: Login to GHCR (runner + VPS)
        # Runner login: needed for `docker manifest inspect` in the wait step.
        # VPS login: done from THIS job so the token is still valid at pull time.
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          ssh vps "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null"

      - name: Wait for images (abort fast if a build fails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}
          FRONTEND_IMAGE: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}
        run: |
          # NOTHING on the stack is mutated until BOTH tags exist on GHCR. If a
          # build job fails or is cancelled (superseded push), abort immediately
          # with production untouched.
          for i in $(seq 1 90); do
            if docker manifest inspect "$BACKEND_IMAGE" >/dev/null 2>&1 \
               && docker manifest inspect "$FRONTEND_IMAGE" >/dev/null 2>&1; then
              echo "Both images available after ~$(( (i - 1) * 5 ))s of waiting."
              exit 0
            fi
            BAD=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=50" \
              --jq '[.jobs[] | select(.name | startswith("Build & Push")) | select(.conclusion == "failure" or .conclusion == "cancelled")] | length' || echo 0)
            if [ "${BAD:-0}" -gt 0 ]; then
              echo "::error::A build job failed or was cancelled — aborting before touching production."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for images on GHCR."
          exit 1

      - name: Write .env on VPS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > /tmp/.env.deploy << 'EOF'
          NODE_ENV=${{ vars.NODE_ENV }}
          PORT=${{ vars.PORT }}
          TZ=${{ vars.TZ }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ vars.DB_NAME }}
          DB_SSLMODE=${{ vars.DB_SSLMODE }}
          DB_MAX_CONNS=${{ vars.DB_MAX_CONNS }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TOKEN_HMAC_KEY=${{ secrets.TOKEN_HMAC_KEY }}
          COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}
          COOKIE_SECURE=${{ vars.COOKIE_SECURE }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
          BACKEND_PUBLIC_URL=${{ vars.BACKEND_PUBLIC_URL }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          WAHA_API_KEY=${{ secrets.WAHA_API_KEY }}
          ML_CREDENTIALS_ENCRYPTION_KEY=${{ secrets.ML_CREDENTIALS_ENCRYPTION_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
          WEBPUSH_SUBSCRIBER=${{ vars.WEBPUSH_SUBSCRIBER }}
          KIWIFY_WEBHOOK_TOKEN=${{ secrets.KIWIFY_WEBHOOK_TOKEN }}
          KIWIFY_API_CLIENT_ID=${{ secrets.KIWIFY_API_CLIENT_ID }}
          KIWIFY_API_CLIENT_SECRET=${{ secrets.KIWIFY_API_CLIENT_SECRET }}
          KIWIFY_API_ACCOUNT_ID=${{ secrets.KIWIFY_API_ACCOUNT_ID }}
          KIWIFY_API_PRODUCT_ID=${{ vars.KIWIFY_API_PRODUCT_ID }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}
          AI_API_URL=${{ vars.AI_API_URL }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=${{ vars.AI_MODEL }}
          FEATURE_USE_MULTI_INSTANCE_DISPATCH=${{ vars.FEATURE_USE_MULTI_INSTANCE_DISPATCH }}
          SESSION_PACE_MS=${{ vars.SESSION_PACE_MS }}
          MEDIA_PACE_MS=${{ vars.MEDIA_PACE_MS }}
          PRODUCER_USER_MAX_ENQUEUED_10MIN=${{ vars.PRODUCER_USER_MAX_ENQUEUED_10MIN }}
          # Scheduler paralelo (default 1 = serial). Sem isto, uma API externa
          # degradada (ex.: Shopee em timeout) pendura cada busca no loop serial
          # e starva TODAS as automacoes — intervalo de 3min vira entrega de 30min.
          # Vazio cai pro default 1 (seguro). Valor de prod na var de repo.
          SCHEDULER_CONCURRENCY=${{ vars.SCHEDULER_CONCURRENCY }}
          # Concorrencia do worker asynq (default viper 20). Subido pra 40 porque
          # o WHATSAPP_HOOK_EVENTS=message.any faz TODO envio do bot ecoar como
          # webhook fromMe (~2x o volume) — a 20 a fila de webhooks acumulava
          # (backlog 3k+) e o relay atrasava 4-5min. Vazio cai pro default 20.
          WORKER_CONCURRENCY=${{ vars.WORKER_CONCURRENCY }}
          IMAGE_MIN_ASPECT=${{ vars.IMAGE_MIN_ASPECT }}
          IMAGE_MAX_ASPECT=${{ vars.IMAGE_MAX_ASPECT }}
          IMAGE_RELAY_MAX_ASPECT=${{ vars.IMAGE_RELAY_MAX_ASPECT }}
          FEATURE_ENFORCE_PLAN_GROUP_LIMITS=${{ vars.FEATURE_ENFORCE_PLAN_GROUP_LIMITS }}
          FEATURE_KIWIFY_STRICT_SIGNATURE=${{ vars.FEATURE_KIWIFY_STRICT_SIGNATURE }}
          # Chip reserva / failover de instância (Melhoria 5).
          # ""/ausente = desligado. Ligado, o DispatchGate passa a pegar uma lease
          # por execução nos TRÊS produtores — custo no caminho quente de envio.
          # Rollback sem deploy: gh variable set FEATURE_INSTANCE_FAILOVER --body false
          # + bounce. ATENÇÃO: desligar NÃO reverte automações já trocadas para a
          # reserva, e não abandona operação em curso (o gate se rearma no boot).
          FEATURE_INSTANCE_FAILOVER=${{ vars.FEATURE_INSTANCE_FAILOVER }}
          # Texto de disparo no modo monitoramento (reativação gradual da PR #243).
          # ""/ausente/"off" = desligado (default seguro: o espelho repassa o texto
          # do grupo). "all" = todos. "id1,id2" = allowlist de user_ids (canário).
          # Rollout sem novo deploy: gh variable set MONITOR_DISPATCH_TEXT --body <valor>.
          MONITOR_DISPATCH_TEXT=${{ vars.MONITOR_DISPATCH_TEXT }}
          # Melhoria 9 — ledger de ofertas/campanhas do monitor (migração 079).
          # Formato dos DOIS: ""/"off" (default) | "all" | "id1,id2" (canário).
          # Token fora disso é ERRO DE BOOT, nunca "all".
          #
          # MONITOR_PRODUCT_RETRY liga o ledger, a task de retry e a
          # recuperação nos dois modos. MONITOR_MIRROR_CONTENT libera o espelho
          # de texto/mídia SEM link comercial no modo monitoring.
          #
          # OFF não desliga segurança: host exato, anti-SSRF e a proibição de
          # emitir URL comercial crua valem sempre.
          # Rollback sem deploy: gh variable set MONITOR_PRODUCT_RETRY --body off
          MONITOR_PRODUCT_RETRY=${{ vars.MONITOR_PRODUCT_RETRY }}
          MONITOR_MIRROR_CONTENT=${{ vars.MONITOR_MIRROR_CONTENT }}
          # Cadência durável entre mensagens espelhadas (Melhoria 7, migração 078).
          # ""/ausente/"false" = INERTE: a admissão retorna antes de tocar o banco e
          # o espelho segue imediato. "true" = ligada — cada mensagem monitorada com
          # link passa a custar uma consulta a mais no caminho quente do webhook, e
          # automações com monitor_interval_minutes > 0 passam a enfileirar.
          # Rollback sem deploy: gh variable set FEATURE_MONITOR_DISPATCH_CADENCE
          # --body false + bounce. Desligar NÃO descarta fila: poller, worker e
          # manutenção continuam registrados para drenar em ordem o que já entrou.
          FEATURE_MONITOR_DISPATCH_CADENCE=${{ vars.FEATURE_MONITOR_DISPATCH_CADENCE }}
          # Rollout dos cupons v2 (desempate official_only-first + cupom na BUSCA).
          # ""/ausente/"off" = desligado (default seguro: matcher mantém a ordem
          # antiga por min_price; busca NÃO aplica cupom). "all" = todos.
          # "id1,id2" = allowlist de user_ids (canário). Rollout sem novo deploy:
          # gh variable set COUPON_RULES_ROLLOUT_USERS --body <valor>.
          COUPON_RULES_ROLLOUT_USERS=${{ vars.COUPON_RULES_ROLLOUT_USERS }}
          # Regras de cupom por categoria/nicho Shopee (migração 075, no ar desde
          # 23/07). ""/ausente/"false" = matcher IGNORA as categorias do produto:
          # toda regra com nicho fica INERTE (nunca casa) — era o estado até 29/07.
          # "true" = o nicho passa a filtrar; regra sem nicho segue casando igual.
          # Rollback sem deploy: gh variable set COUPON_CATEGORY_RULES_ENABLED
          # --body false + bounce. NUNCA "corrigir" zerando product_category_ids:
          # isso converte regra específica em genérica e ALARGA o alcance dela.
          COUPON_CATEGORY_RULES_ENABLED=${{ vars.COUPON_CATEGORY_RULES_ENABLED }}
          # Lojas com conversor próprio (Amazon, AliExpress, Awin).
          # ""/ausente/"false" = registry nil: nenhum link dessas lojas é
          # convertido e o espelho continua REMOVENDO-os do corpo, como sempre
          # fez. "true" = converte, mas só em automação que listou a loja E cujo
          # dono tem credencial ativa (opt-in duplo) — automação existente, que
          # tem stores=["shopee"], não muda de comportamento.
          # Rollback sem deploy: gh variable set AFFILIATE_STORES_V2 --body false
          # + bounce do server/worker.
          AFFILIATE_STORES_V2=${{ vars.AFFILIATE_STORES_V2 }}
          # Conversão automática do link de afiliado do Mercado Livre.
          # ""/ausente/"off" = passthrough, o comportamento de sempre: o cliente
          # cola o link que ele mesmo gerou no linkbuilder e nós só despachamos.
          # "all" ou lista de UUIDs = o backend gera o link DO DONO a partir da
          # URL crua do produto. Link que já é meli.la//sec/ NUNCA é tocado
          # (2,43M de itens em produção), e qualquer falha cai em passthrough.
          # Rollback sem deploy: gh variable set ML_AUTO_LINK --body off + bounce.
          ML_AUTO_LINK=${{ vars.ML_AUTO_LINK }}
          # Verificação periódica da sessão do ML (cron de 1h, lotes de 40).
          # ""/ausente/"false" = desligado. Só ligar DEPOIS de a migração 084
          # aplicar — sem as colunas novas o SELECT do lote falha. Faz chamadas
          # autenticadas ao painel do ML: mal calibrado, vira ele próprio a
          # causa do bloqueio que deveria detectar (por isso lote pequeno,
          # jitter e abort ao primeiro sinal de bloqueio).
          ML_SESSION_HEALTH_ENABLED=${{ vars.ML_SESSION_HEALTH_ENABLED }}
          # Lean-persist do consumer de webhooks (4→2 statements PG/evento).
          # ""/ausente/"false" = caminho clássico (default seguro). "true" =
          # caminho enxuto (MarkProcessedEnsure). Rollout/rollback sem deploy:
          # gh variable set WEBHOOK_LEAN_PERSIST --body true|false + bounce.
          WEBHOOK_LEAN_PERSIST=${{ vars.WEBHOOK_LEAN_PERSIST }}
          # Tracking historico de membros de grupo (Melhoria 2, Fase A).
          # ""/ausente/"false" = INERTE: zero escrita nova, zero chamada WAHA de
          # reconciliacao. Rollout/rollback sem deploy: gh variable set
          # GROUP_MEMBER_TRACKING_ENABLED --body true|false + bounce.
          GROUP_MEMBER_TRACKING_ENABLED=${{ vars.GROUP_MEMBER_TRACKING_ENABLED }}
          # Segredo DEDICADO dos hashes de identidade (min 32 bytes). Sem
          # fallback pra JWT_SECRET/TOKEN_HMAC_KEY de proposito. IMUTAVEL apos o
          # primeiro rollout com escrita: os valores brutos nao sao armazenados,
          # entao troca-lo criaria identidades novas. Ausente/curto com a flag
          # ligada = servico inerte + um unico erro de inicializacao.
          GROUP_MEMBER_HASH_SECRET=${{ secrets.GROUP_MEMBER_HASH_SECRET }}
          # Instagram: kill switch da feature. Ausente/"false" = a tela mostra
          # "em breve" e o gatilho {story} vira no-op. Rollout/rollback sem
          # deploy: gh variable set INSTAGRAM_STORIES_ENABLED --body true|false
          # + bounce.
          INSTAGRAM_STORIES_ENABLED=${{ vars.INSTAGRAM_STORIES_ENABLED }}
          # Segredo DEDICADO que assina o state do OAuth do Instagram. Separado
          # do HMAC de tokens de proposito: reaproveitar aquela chave faria um
          # vazamento do state virar comprometimento de sessao. Ausente/curto
          # (<32 bytes) = Configured() false e a feature NAO liga, mesmo com o
          # switch acima em true.
          INSTAGRAM_STATE_SIGNING_KEY=${{ secrets.INSTAGRAM_STATE_SIGNING_KEY }}
          # Kill switch GLOBAL da resposta automática, SEPARADO do de Stories:
          # permite o canal ligado (cliente conectando conta, publicando Story)
          # com a IA desligada para todos. Mesmo em true, cada cliente ainda
          # precisa ligar o próprio instagram_ai_configs.is_active — que nasce
          # false. Rollout/rollback sem deploy: gh variable set
          # INSTAGRAM_AI_REPLY_ENABLED --body true|false + bounce.
          INSTAGRAM_AI_REPLY_ENABLED=${{ vars.INSTAGRAM_AI_REPLY_ENABLED }}
          # App GLOBAL da Meta: opcional e normalmente VAZIO. Desde a Fase 1
          # cada cliente registra o proprio app (instagram_apps), que e o que
          # dispensa o App Review da Meta. Estas duas existem so como fallback
          # para quem tenha conectado pelo modo antigo.
          INSTAGRAM_APP_ID=${{ vars.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET=${{ secrets.INSTAGRAM_APP_SECRET }}
          # Image pins: o compose usa ${BACKEND_IMAGE:-...latest}. Sem estes pins no
          # .env, qualquer `docker compose up` MANUAL no box (fora do CI) derruba a
          # build pra :latest. O CI ja passa os tags inline; isto protege ops manuais.
          BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}/backend:${{ env.VERSION }}
          FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}/frontend:${{ env.VERSION }}
          EOF
          # Remove leading whitespace from heredoc
          sed 's/^          //' /tmp/.env.deploy > /tmp/.env.clean
          # Ship the CI-managed .env to a staging path, then MERGE server-side. Some
          # vars are ops-managed and live ONLY on the VPS (WAHA S3 media credentials
          # and the per-session proxy pool, added out-of-band by the waha-fix ops
          # toolkit — they are intentionally not CI secrets). Overwriting .env wholesale
          # would strip them and break WAHA media storage, so we preserve them here.
          # .env.prev keeps the previous pins for a one-command manual rollback.
          scp /tmp/.env.clean vps:/opt/automatiza/docker/.env.ci
          ssh vps '
            cd /opt/automatiza/docker
            OPS=$(grep -E "^(WAHA_MEDIA_STORAGE|WAHA_S3_[A-Z_]+|WAHA_SESSION_PROXIES)=|^#\[proxy-disabled" .env 2>/dev/null || true)
            cp .env .env.prev 2>/dev/null || true
            cp .env.ci .env
            if [ -n "$OPS" ]; then
              printf "\n# --- ops-managed, preserved across deploys: WAHA S3 media + session proxies ---\n" >> .env
              printf "%s\n" "$OPS" >> .env
            fi
            chmod 600 .env
            rm -f .env.ci
            MISSING=""
            for key in NODE_ENV PORT DB_USER DB_PASSWORD DB_NAME JWT_SECRET COOKIE_DOMAIN CORS_ORIGIN BACKEND_PUBLIC_URL SENTRY_DSN; do
              val=$(grep "^${key}=" .env | cut -d= -f2-)
              if [ -z "$val" ]; then
                MISSING="${MISSING}  - ${key}\n"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "WARNING: The following critical variables are empty:"
              printf "$MISSING"
              echo "Check GitHub Settings > Environments > production > Variables/Secrets"
            else
              echo "All critical .env variables are set."
            fi
          '
          rm -f /tmp/.env.deploy /tmp/.env.clean

      - name: Rolling deploy (worker drained, WAHA untouched)
        env:
          FULL_RESTART: ${{ inputs.full_restart }}
        run: |
          # Sequence designed so NO send is in flight while the send path
          # (waha-router) or the webhook receiver (server) bounces:
          #   1. pull new images (no mutation)
          #   2. graceful worker stop in background — honors stop_grace_period 4m
          #      (the old `up -d --timeout 30` OVERRODE that grace and SIGKILLed
          #      the worker mid-send at 30s: duplicates + the 15:12 storm of
          #      "failed to check session status" for 48 users)
          #   3. migrations run while the worker drains (ledger-tracked: seconds)
          #   4. recreate server/frontend/waha-router with the worker offline —
          #      queued sends wait in redis instead of failing against a
          #      half-recreated router
          #   5. health-gate the server, then bring the worker back
          # A trap guarantees the worker is ALWAYS brought back up, even if a
          # later step fails — sends must never stay paused after a red deploy.
          # postgres/redis/waha/waha-2 are stateful and NEVER recreated here
          # (recreate do WAHA em 11/07 derrubou ~550 sessões pareadas); a
          # recriação deliberada da infra usa o input full_restart.
          #
          # The script is shipped as a FILE and executed, never piped into
          # `bash -s`: with a stdin-fed script, `docker compose run` (stdin
          # attached by default) SWALLOWS the rest of the script — on 17/07 the
          # run ended silently right after migrations and the rollout never
          # happened. A file-based script has no stdin to steal.
          cat > /tmp/deploy-vps.sh << 'SCRIPT'
          set -euo pipefail
          FULL_RESTART="${1:-false}"
          MIGRATION_TRACE_ID="${2:?migration trace id is required}"
          cd /opt/automatiza/docker
          export $(grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env | xargs)

          WAHA_BEFORE=$(docker inspect -f '{{.Id}}' automatiza-waha automatiza-waha-2 2>/dev/null || true)

          if [ "$FULL_RESTART" = "true" ]; then
            echo "=== FULL RESTART requested: stopping entire stack (WAHA sessions will reconnect) ==="
            docker compose down --timeout 30 || true
          fi

          echo "=== Pulling application images ==="
          docker compose pull -q server worker frontend

          echo "=== Draining worker (graceful, overlapped with migrations) ==="
          docker compose stop worker &
          WORKER_STOP=$!
          trap 'docker compose up -d --no-deps worker >/dev/null 2>&1 || true' EXIT

          echo "=== Running migrations ==="
          # -T + </dev/null: belt and suspenders against stdin/TTY capture.
          # Migração quebrada = deploy ABORTA (run-migrations.sh agora roda com
          # ON_ERROR_STOP=1 e sai non-zero). Antes o erro era mascarado e o
          # código novo subia sem o schema que esperava (precedente: 23514/071).
          # O .env já aponta para as imagens NOVAS neste ponto — restaura os
          # pins antigos de .env.prev antes de sair, para o trap religar o
          # worker com a imagem ANTIGA (consistente com o schema não migrado).
          if ! docker compose run --rm -T \
            -e MIGRATION_TRACE_ID="$MIGRATION_TRACE_ID" \
            migrate </dev/null; then
            echo "error_code=migration_deploy_blocked event=deploy_aborted trace_id=$MIGRATION_TRACE_ID"
            echo "ERROR: migrations failed — restoring previous image pins and aborting deploy"
            wait "$WORKER_STOP" || true
            if [ -f .env.prev ]; then
              cp .env.prev .env
              export $(grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env | xargs)
            fi
            exit 1
          fi

          wait "$WORKER_STOP" || true
          echo "Worker drained."

          echo "=== Rolling out new images ==="
          docker compose up -d --no-recreate postgres redis waha waha-2
          # --no-deps é OBRIGATÓRIO aqui, não estilo. `up -d <svc>` também sobe
          # as DEPENDÊNCIAS do serviço, e sem --no-deps ele as RECRIA quando
          # estão config-dirty — anulando o --no-recreate da linha acima.
          # waha-router depends_on waha/waha-2; server depends_on postgres/redis.
          # Incidente 23/07/2026: uma mudança em WHATSAPP_HOOK_EVENTS deixou os
          # dois shards dirty e este comando recriou ambos, parando ~724 sessões
          # pareadas (recuperadas pelo auto-start, mas ~20min de chips fora).
          docker compose up -d --no-deps server frontend waha-router

          echo "=== Waiting for backend health ==="
          HEALTHY=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/health >/dev/null 2>&1; then
              HEALTHY=1
              echo "Backend is healthy! (after ~${i}s)"
              break
            fi
            sleep 1
          done

          echo "=== Restarting worker ==="
          # --no-deps: worker depends_on postgres/redis (stateful). Ver acima.
          docker compose up -d --no-deps worker
          trap - EXIT

          if [ "$FULL_RESTART" != "true" ]; then
            WAHA_AFTER=$(docker inspect -f '{{.Id}}' automatiza-waha automatiza-waha-2 2>/dev/null || true)
            if [ "$WAHA_BEFORE" != "$WAHA_AFTER" ]; then
              echo "::warning::WAHA containers were recreated during this deploy — paired sessions are reconnecting. Investigate: this should NEVER happen on a rolling deploy."
            fi
          fi

          echo "=== Container status ==="
          docker compose ps

          if [ "$HEALTHY" != 1 ]; then
            echo "=== HEALTH CHECK FAILED - DEBUG INFO ==="
            echo "--- Server logs (last 50 lines) ---"
            docker compose logs server --tail=50
            echo "--- Worker logs (last 20 lines) ---"
            docker compose logs worker --tail=20
            exit 1
          fi
          SCRIPT
          scp /tmp/deploy-vps.sh vps:/opt/automatiza/docker/.deploy.sh
          # These arguments are intentionally expanded by the trusted CI runner.
          # shellcheck disable=SC2029
          ssh vps "bash /opt/automatiza/docker/.deploy.sh '${FULL_RESTART:-false}' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed for version ${{ steps.version.outputs.version }}"
          echo "Check VPS logs: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd /opt/automatiza/docker && docker compose logs --tail=50'"
