name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/deveduardosouza/automatiza
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "version=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # --- Proto generation (needed for frontend build) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate Proto Stubs
        working-directory: client
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          buf generate

      # --- Docker builds ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: automatiza-go
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            SENTRY_ORG=automatiza
            SENTRY_PROJECT=automatiza-frontend
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ steps.version.outputs.version }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write .env on VPS
        run: |
          cat > /tmp/.env.deploy << 'EOF'
          NODE_ENV=${{ vars.NODE_ENV }}
          PORT=${{ vars.PORT }}
          TZ=${{ vars.TZ }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ vars.DB_NAME }}
          DB_SSLMODE=${{ vars.DB_SSLMODE }}
          DB_MAX_CONNS=${{ vars.DB_MAX_CONNS }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TOKEN_HMAC_KEY=${{ secrets.TOKEN_HMAC_KEY }}
          COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}
          COOKIE_SECURE=${{ vars.COOKIE_SECURE }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
          BACKEND_PUBLIC_URL=${{ vars.BACKEND_PUBLIC_URL }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          WAHA_API_KEY=${{ secrets.WAHA_API_KEY }}
          ML_CREDENTIALS_ENCRYPTION_KEY=${{ secrets.ML_CREDENTIALS_ENCRYPTION_KEY }}
          KIWIFY_WEBHOOK_TOKEN=${{ secrets.KIWIFY_WEBHOOK_TOKEN }}
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}
          AI_API_URL=${{ vars.AI_API_URL }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=${{ vars.AI_MODEL }}
          EOF
          # Remove leading whitespace from heredoc
          sed 's/^          //' /tmp/.env.deploy > /tmp/.env.clean
          scp -i ~/.ssh/deploy_key /tmp/.env.clean \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/automatiza/docker/.env
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chmod 600 /opt/automatiza/docker/.env'
          rm -f /tmp/.env.deploy /tmp/.env.clean

      - name: Validate .env on VPS
        run: |
          echo "=== Validating .env on VPS ==="
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            ENV_FILE="/opt/automatiza/docker/.env"
            MISSING=""
            for key in NODE_ENV PORT DB_USER DB_PASSWORD DB_NAME JWT_SECRET COOKIE_DOMAIN CORS_ORIGIN BACKEND_PUBLIC_URL SENTRY_DSN; do
              val=$(grep "^${key}=" "$ENV_FILE" | cut -d= -f2-)
              if [ -z "$val" ]; then
                MISSING="${MISSING}  - ${key}\n"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "WARNING: The following critical variables are empty:"
              printf "$MISSING"
              echo "Check GitHub Settings > Environments > production > Variables/Secrets"
            else
              echo "All critical variables are set."
            fi
            echo "--- .env keys (values masked) ---"
            awk -F= "{print \$1 \"=\" (length(\$2) > 0 ? \"[SET]\" : \"[EMPTY]\")}" "$ENV_FILE"
          '

      - name: Copy docker-compose.yml to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/automatiza/docker/docker-compose.yml

      - name: Deploy containers
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          # Step 1: Login to registries
          $SSH_CMD "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null"
          $SSH_CMD "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u devlikeapro --password-stdin 2>/dev/null" || echo "WARNING: Docker Hub login failed (WAHA image may use cached version)"

          # Step 2: Pull new images (with explicit image tags)
          $SSH_CMD "cd /opt/automatiza/docker && BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}/backend:${VERSION} FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}/frontend:${VERSION} docker compose pull server worker frontend postgres redis waha"

          # Step 3: Run migrations (allowed to fail without blocking deploy)
          echo "=== Running migrations ==="
          $SSH_CMD "cd /opt/automatiza/docker && BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}/backend:${VERSION} FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}/frontend:${VERSION} docker compose run --rm migrate" || echo "WARNING: Migrations returned non-zero exit code (may be OK if idempotent)"

          # Step 4: Stop ALL old containers and start fresh with new images
          echo "=== Stopping old containers ==="
          $SSH_CMD "cd /opt/automatiza/docker && docker compose down --timeout 30" || true

          echo "=== Starting services with new images ==="
          $SSH_CMD "cd /opt/automatiza/docker && BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}/backend:${VERSION} FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}/frontend:${VERSION} docker compose up -d postgres redis waha server worker frontend"

          echo "=== Verifying containers ==="
          sleep 5
          $SSH_CMD "cd /opt/automatiza/docker && docker compose ps"

      - name: Health check via SSH
        run: |
          echo "Waiting for services to stabilize..."
          sleep 15
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            cd /opt/automatiza/docker
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/api/v1/health; then
                echo ""
                echo "Backend is healthy!"
                exit 0
              fi
              echo "Attempt $i/5 failed, retrying in 10s..."
              sleep 10
            done
            echo "=== HEALTH CHECK FAILED - DEBUG INFO ==="
            echo "--- Container status ---"
            docker compose ps
            echo "--- Server logs (last 50 lines) ---"
            docker compose logs server --tail=50
            echo "--- Worker logs (last 20 lines) ---"
            docker compose logs worker --tail=20
            exit 1
          '

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed for version ${{ needs.build-and-push.outputs.version }}"
          echo "Check VPS logs: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd /opt/automatiza/docker && docker compose logs --tail=50'"
