name: Setup VPS

on:
  workflow_dispatch:
    inputs:
      ssl_email:
        description: "Email for Let's Encrypt SSL certificate"
        required: true
        default: "bruno.clara@yahoo.com"
      setup_ssh_key:
        description: "Generate and configure SSH key (first run only)"
        type: boolean
        default: true
      cleanup_systemd:
        description: "Remove old systemd services (after migration to Docker)"
        type: boolean
        default: false

jobs:
  setup:
    name: Setup VPS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Setup SSH key (if first run)
        if: ${{ inputs.setup_ssh_key }}
        run: |
          # Generate SSH key pair
          ssh-keygen -t ed25519 -f deploy_key -N "" -C "github-actions-deploy"

          echo "Add this PRIVATE key to GitHub Secrets as VPS_SSH_KEY:"
          echo "----------------------------------------"
          cat deploy_key
          echo "----------------------------------------"

          # Store public key for later
          echo "PUBLIC_KEY=$(cat deploy_key.pub)" >> $GITHUB_ENV

      - name: Connect and setup VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SETUP_SCRIPT'
            set -e

            echo "=== Updating system ==="
            apt-get update && apt-get upgrade -y

            echo "=== Installing essential packages ==="
            apt-get install -y \
              curl wget git unzip \
              nginx certbot python3-certbot-nginx \
              fail2ban ufw \
              ca-certificates gnupg

            echo "=== Installing Docker ==="
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            echo "=== Installing Docker Compose ==="
            if ! command -v docker-compose &> /dev/null; then
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            echo "=== Creating automatiza user ==="
            if ! id "automatiza" &>/dev/null; then
              useradd -r -m -s /bin/bash automatiza
              usermod -aG docker automatiza
            fi

            echo "=== Creating directory structure ==="
            mkdir -p /opt/automatiza/{docker,nginx,scripts}
            chown -R automatiza:automatiza /opt/automatiza

            echo "=== Configuring firewall ==="
            ufw default deny incoming
            ufw default allow outgoing
            ufw allow 22/tcp
            ufw allow 80/tcp
            ufw allow 443/tcp
            ufw --force enable

            echo "=== Configuring fail2ban ==="
            cat > /etc/fail2ban/jail.local << 'F2B'
            [DEFAULT]
            bantime = 3600
            findtime = 600
            maxretry = 5

            [sshd]
            enabled = true
            port = 22
            filter = sshd
            logpath = /var/log/auth.log
            maxretry = 3
            F2B
            systemctl enable fail2ban
            systemctl restart fail2ban

            echo "=== Base setup complete! ==="
          SETUP_SCRIPT

      - name: Add SSH public key to VPS
        if: ${{ inputs.setup_ssh_key }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            mkdir -p ~/.ssh
            echo "${{ env.PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
            chmod 700 ~/.ssh
            chmod 600 ~/.ssh/authorized_keys
            echo "SSH key added!"
          EOF

      - name: Upload configuration files
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Upload docker-compose
          sshpass -e scp -o StrictHostKeyChecking=no \
            docker/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/automatiza/docker/docker-compose.yml

          # Upload nginx config
          sshpass -e scp -o StrictHostKeyChecking=no \
            nginx/astecwms.com.br.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/automatiza/nginx/

      - name: Configure services
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SERVICES'
            set -e

            echo "=== Configuring Nginx ==="
            ln -sf /opt/automatiza/nginx/astecwms.com.br.conf /etc/nginx/sites-available/astecwms.com.br
            ln -sf /etc/nginx/sites-available/astecwms.com.br /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx

            echo "=== Services configured! ==="
          SERVICES

      - name: Cleanup old systemd services
        if: ${{ inputs.cleanup_systemd }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'CLEANUP'
            set -e
            echo "=== Removing old systemd services ==="

            systemctl stop automatiza-server automatiza-worker automatiza-frontend 2>/dev/null || true
            systemctl disable automatiza-server automatiza-worker automatiza-frontend 2>/dev/null || true
            rm -f /etc/systemd/system/automatiza-{server,worker,frontend}.service
            systemctl daemon-reload

            echo "=== Cleaning old deployment files ==="
            rm -rf /opt/automatiza/backend /opt/automatiza/frontend /opt/automatiza/env.conf

            echo "=== Cleanup complete! ==="
          CLEANUP

      - name: Setup SSL Certificate
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            echo "=== Obtaining SSL certificate ==="
            certbot --nginx \
              -d astecwms.com.br \
              -d www.astecwms.com.br \
              --non-interactive \
              --agree-tos \
              -m ${{ inputs.ssl_email }}

            echo "=== Setting up auto-renewal ==="
            systemctl enable certbot.timer
            systemctl start certbot.timer

            echo "=== SSL configured! ==="
          EOF

      - name: Start Docker services
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << DOCKER
            echo "=== Logging into Docker Hub (WAHA) ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u devlikeapro --password-stdin

            cd /opt/automatiza/docker
            docker compose up -d postgres redis waha

            echo "Waiting for PostgreSQL..."
            sleep 10
            docker compose ps

            echo "=== Docker services started! ==="
          DOCKER

      - name: Final status check
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'STATUS'
            echo "=== System Status ==="
            echo ""
            echo "Docker containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
            echo "Firewall:"
            ufw status
            echo ""
            echo "Fail2ban:"
            fail2ban-client status sshd
            echo ""
            echo "Nginx:"
            nginx -t
            echo ""
            echo "SSL Certificate:"
            certbot certificates
            echo ""
            echo "Directory structure:"
            ls -la /opt/automatiza/
            echo ""
            echo "=== VPS setup complete! ==="
          STATUS

      - name: Output SSH key reminder
        if: ${{ inputs.setup_ssh_key }}
        run: |
          echo "IMPORTANT: Copy the PRIVATE key from the 'Setup SSH key' step above"
          echo "   and add it to GitHub Secrets as VPS_SSH_KEY"
          echo ""
          echo "After adding the secret, deploys will use SSH key auth (no more sshpass)."
