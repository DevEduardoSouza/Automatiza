name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# A newer push to the same branch/PR cancels in-flight CI for the superseded
# commit — no runner time wasted finishing checks nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  # Detect which stacks the commit actually touches so untouched ones skip
  # entirely. Job-level skips (unlike workflow-level `paths:`) still report a
  # conclusion, so required status checks stay green on the PR.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # For push events, compare against the previous commit of the same
          # branch; ignored on pull_request (the PR diff is used).
          base: ${{ github.ref_name }}
          # proto/** is in both filters: client/proto and automatiza-go/proto
          # are symlinks into it.
          filters: |
            frontend:
              - 'client/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'automatiza-go/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  # All jobs below fan out in parallel from `changes` — tests no longer wait
  # for lints, so the critical path is the single slowest job instead of
  # lint + test stacked.
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            client
            proto

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules directly (not just ~/.npm): on a lockfile hit,
      # `npm ci` is skipped entirely.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run BiomeJS lint
        working-directory: client
        run: npm run lint

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: required by golangci-lint only-new-issues.
          fetch-depth: 0
          sparse-checkout: |
            automatiza-go
            proto

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: automatiza-go/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: automatiza-go
          only-new-issues: true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    continue-on-error: true # Pre-existing test failures — tracked for fix
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            client
            proto

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate proto stubs
        working-directory: client
        # buf comes from node_modules (@bufbuild/buf, pinned by the lockfile).
        run: npx buf generate

      - name: Run tests
        working-directory: client
        run: npm run test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: client/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    continue-on-error: true # Pre-existing test failures — tracked for fix
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: automatiza_test
        ports:
          - 5432:5432
        # Tight health interval: the job's steps only start once services are
        # healthy, so a 10s interval used to add ~10s of dead wait.
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automatiza-go
            proto

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: automatiza-go/go.sum

      - name: Run tests
        working-directory: automatiza-go
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/automatiza_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: automatiza-go/coverage.out
          flags: backend
          fail_ci_if_error: false

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            client
            automatiza-go
            proto

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: automatiza-go/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Backend
        working-directory: automatiza-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server

      - name: Build Frontend
        working-directory: client
        run: |
          npx buf generate
          npm run build

      - name: Verify builds
        run: |
          test -f automatiza-go/server && echo "✅ Backend binary created"
          test -d client/dist && echo "✅ Frontend dist created"
