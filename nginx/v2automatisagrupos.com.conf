# ─── Cloudflare Real IP ───────────────────────────────────────────────────────
# Restore the visitor's real IP from Cloudflare's CF-Connecting-IP header.
# Without this, $remote_addr is always a Cloudflare edge IP.
# Keep in sync: https://www.cloudflare.com/ips/

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ─── Rate Limiting ────────────────────────────────────────────────────────────
# Now $binary_remote_addr is the real visitor IP (not Cloudflare's).
# Zone "general": 10 req/s per IP, burst 20 (queued), 10 MB shared memory (~160k IPs).
# Zone "api": 30 req/s per IP for API/ConnectRPC, burst 50.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# ─── Custom Log Format (includes real IP + Cloudflare headers) ────────────────
log_format cf_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"cf_ip":"$http_cf_connecting_ip",'
    '"cf_country":"$http_cf_ipcountry",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"traceparent":"$http_traceparent"'
    '}';

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name v2automatisagrupos.com www.v2automatisagrupos.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v2automatisagrupos.com www.v2automatisagrupos.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/v2automatisagrupos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2automatisagrupos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml
               application/font-woff application/font-woff2 image/svg+xml;

    # ─── Frontend: Vite hashed assets (/assets/*) ────────────────────────────
    # Vite generates filenames with content hashes (e.g. index-DkR3f2x.js).
    # Safe to cache aggressively — a code change = new filename.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Strip any accidental Set-Cookie from upstream
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Immutable + long TTL (Cloudflare respects these)
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        limit_req zone=general burst=20 nodelay;
    }

    # ─── Frontend: Public HTML pages (SPA shell) ─────────────────────────────
    # The React SPA returns index.html for all unmatched routes.
    # Strip Set-Cookie so Cloudflare can cache the HTML (Cache Rule C).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip Set-Cookie so Cloudflare caches public HTML
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        limit_req zone=general burst=20 nodelay;
    }

    # ─── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # File uploads
        client_max_body_size 50M;

        limit_req zone=api burst=50 nodelay;
    }

    # ─── ConnectRPC (gRPC-Web) ───────────────────────────────────────────────
    location /connect/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;

        # Required for gRPC
        proxy_buffering off;
        proxy_request_buffering off;

        limit_req zone=api burst=50 nodelay;
    }

    # ─── Health check (no rate limit, no auth) ───────────────────────────────
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow all;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Logging with real IP + Cloudflare metadata
    access_log /var/log/nginx/v2automatisagrupos.access.log cf_json;
    error_log /var/log/nginx/v2automatisagrupos.error.log;
}
