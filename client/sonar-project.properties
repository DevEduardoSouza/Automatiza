# =============================================================================
# SonarQube Configuration - React 19 Frontend
# =============================================================================
# Stack: React 19 + TypeScript + Vite + Tailwind + Connect-RPC
# Quality Gates: Aggressive enterprise settings
# =============================================================================

# Project identification
sonar.projectKey=automatiza-client
sonar.projectName=Automatiza - React Frontend
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/gen/**,\
  **/__mocks__/**,\
  **/e2e/**

# TypeScript/JavaScript configuration
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# =============================================================================
# AGGRESSIVE QUALITY GATES FOR REACT 19
# =============================================================================
# These thresholds are enforced in SonarQube Quality Gate configuration
# See scripts/sonarqube/setup-quality-gates.sh for automated setup
#
# NEW CODE THRESHOLDS (must meet ALL):
# - Coverage on New Code: >= 80%
# - Duplicated Lines on New Code: <= 3%
# - Maintainability Rating: A
# - Reliability Rating: A
# - Security Rating: A
# - Security Hotspots Reviewed: 100%
# - Blocker Issues: 0
# - Critical Issues: 0
#
# OVERALL CODE THRESHOLDS:
# - Coverage: >= 70%
# - Duplicated Lines: <= 5%
# - Maintainability Rating: A (Technical Debt Ratio < 5%)
# - Reliability Rating: A (0 bugs)
# - Security Rating: A (0 vulnerabilities)
# =============================================================================

# Analysis metadata
sonar.links.homepage=https://github.com/brunovilefort/automatiza
sonar.links.ci=https://github.com/brunovilefort/automatiza/actions
sonar.links.issue=https://github.com/brunovilefort/automatiza/issues

# =============================================================================
# React/TypeScript specific rules
# =============================================================================

# Cognitive complexity threshold (aggressive)
sonar.javascript.cognitivecomplexity.threshold=15

# Cyclomatic complexity threshold (aggressive)
sonar.javascript.cyclomaticcomplexity.threshold=10

# Maximum function lines
sonar.javascript.maxFunctionLines=50

# Maximum file lines
sonar.javascript.maxFileLines=500

# =============================================================================
# Security-focused analysis (OWASP)
# =============================================================================
# - XSS detection
# - Hardcoded secrets/credentials
# - Insecure randomness
# - Path traversal
# - Prototype pollution
# =============================================================================

# External issue reports (if using additional tools)
# sonar.externalIssuesReportPaths=biome-report.json
