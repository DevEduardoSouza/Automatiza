server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Vite hashed assets: immutable + 1 year ─────────────────────────────
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ─── Static fonts (if served outside /assets/) ──────────────────────────
    location ~* \.(woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ─── Static images/media ────────────────────────────────────────────────
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ─── index.html: never cache (SPA entry point) ──────────────────────────
    # Sem `internal`: o precache do service worker faz GET direto de /index.html
    # no install — com `internal` o nginx devolveria 404 e o SW nunca instalaria.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── PWA: service worker nunca cacheado (kill switch depende disto) ──────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── PWA: manifest nunca cacheado (identidade pode ganhar campos) ───────
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ─── SPA fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Health check ───────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
