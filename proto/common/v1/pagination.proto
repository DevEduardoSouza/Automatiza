syntax = "proto3";

package common.v1;

option go_package = "github.com/automatiza/proto/common/v1;commonv1";

/**
 * PaginationRequest contains pagination parameters for list operations.
 * Use this message in request messages that support pagination.
 */
message PaginationRequest {
  // Maximum number of items to return. Server may return fewer.
  // Default: 20, Max: 100
  int32 page_size = 1;

  // Token for the next page of results.
  // Empty string or omitted for the first page.
  string page_token = 2;
}

/**
 * PaginationResponse contains pagination metadata for list responses.
 * Include this message in response messages that support pagination.
 */
message PaginationResponse {
  // Token to retrieve the next page.
  // Empty if no more pages.
  string next_page_token = 1;

  // Total count of items (if known).
  // May be 0 if count is expensive to compute.
  int32 total_count = 2;

  // Whether there are more pages available.
  bool has_more = 3;
}
