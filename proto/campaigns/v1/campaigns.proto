syntax = "proto3";

package campaigns.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/automatiza/proto/campaigns/v1;campaignsv1";

// ============================================================
// Campaign Messages
// ============================================================

/**
 * A generated campaign message.
 */
message CampaignMessage {
  // Message text content
  string text = 1;

  // Suggested emoji for the message
  optional string emoji = 2;

  // Target audience description
  optional string target_audience = 3;
}

/**
 * A marketing campaign generated by AI.
 */
message Campaign {
  // Campaign title
  string title = 1;

  // Campaign description
  optional string description = 2;

  // Generated messages for the campaign
  repeated CampaignMessage messages = 3;

  // Suggested hashtags
  repeated string hashtags = 4;

  // Suggested posting times (HH:mm format)
  repeated string suggested_times = 5;
}

// ============================================================
// Create Campaign
// ============================================================

message CreateCampaignRequest {
  // AI prompt describing the desired campaign
  string prompt = 1 [(buf.validate.field).string = {min_len: 10, max_len: 2000}];
}

message CreateCampaignResponse {
  // Whether the operation succeeded
  bool success = 1;

  // Generated campaign
  optional Campaign campaign = 2;

  // Error message if failed
  optional string error = 3;
}

// ============================================================
// Service Definition
// ============================================================

/**
 * CampaignsService provides AI-powered campaign generation.
 */
service CampaignsService {
  // Creates a new marketing campaign using AI.
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);
}
