syntax = "proto3";

package instagram.v1;

option go_package = "github.com/automatiza/proto/instagram/v1;instagramv1";

// ============================================================
// Messages
// ============================================================

// A published (or attempted) Instagram story, for the recent-activity list.
message StoryPost {
  string id = 1;
  // pending | published | failed
  string status = 2;
  // image | rendered_text
  string media_source = 3;
  string source_group = 4;
  string ig_media_id = 5;
  string error = 6;
  // Creation timestamp (ISO 8601)
  string created_at = 7;
}

// The Meta app the CLIENT registered. The app secret is never returned — once
// saved, the UI only learns that one exists.
message MetaApp {
  string app_id = 1;
  // Whether a secret is stored. The secret itself never leaves the server.
  bool has_secret = 2;
  // Full webhook URL the client must paste into their own Meta app dashboard.
  // Carries an opaque per-client token, which is how the server knows whose
  // app signed an incoming webhook before reading the body.
  string webhook_url = 3;
  // Verify token for Meta's webhook handshake (hub.verify_token).
  string verify_token = 4;
  // OAuth redirect URI to register in the client's Meta app. Same for everyone.
  string redirect_uri = 5;
  bool is_verified = 6;
  string updated_at = 7;
}

message GetMetaAppRequest {}

message GetMetaAppResponse {
  // Absent when the client has not registered an app yet.
  MetaApp app = 1;
}

message SaveMetaAppRequest {
  string app_id = 1;
  // Write-only. Empty on update means "keep the stored secret".
  string app_secret = 2;
}

message SaveMetaAppResponse {
  MetaApp app = 1;
}

message DeleteMetaAppRequest {}

message DeleteMetaAppResponse {}

// AI reply configuration owned by the client.
message AIConfig {
  string persona = 1;
  string business_context = 2;
  string tone = 3;
  string blocked_topics = 4;
  string fallback_message = 5;
  bool reply_comments = 6;
  bool reply_dms = 7;
  bool reply_mentions = 8;
  // Master switch for THIS client. Off by default.
  bool is_active = 9;
  string updated_at = 10;
}

message GetAIConfigRequest {}

message GetAIConfigResponse {
  AIConfig config = 1;
  // Whether the platform-wide AI reply switch is on. When false the UI shows
  // the config as unavailable regardless of the client's own switch.
  bool ai_available = 2;
  // Daily reply cap from the client's plan (0 = server default).
  int32 daily_cap = 3;
}

message SaveAIConfigRequest {
  AIConfig config = 1;
}

message SaveAIConfigResponse {
  AIConfig config = 1;
}

// One received event plus, when present, what the AI answered.
message ActivityItem {
  string id = 1;
  // comment | message | mention
  string event_type = 2;
  string content = 3;
  // received | replied | skipped | failed
  string status = 4;
  string error_code = 5;
  string received_at = 6;
  string reply_text = 7;
}

message GetActivityRequest {
  int32 limit = 1;
}

message GetActivityResponse {
  repeated ActivityItem items = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  // Whether the Instagram integration is configured on the server at all
  // (INSTAGRAM_APP_ID present). When false the UI shows "coming soon".
  bool feature_enabled = 1;
  // Whether THIS user has connected an Instagram account.
  bool connected = 2;
  string username = 3;
  string ig_user_id = 4;
  // Token expiry (ISO 8601), empty when not connected.
  string token_expires_at = 5;
  repeated StoryPost recent_stories = 6;
  // Whether THIS user has registered their own Meta app. Connecting an account
  // is impossible before that.
  bool has_meta_app = 7;
}

message GetAuthorizeUrlRequest {}

message GetAuthorizeUrlResponse {
  string url = 1;
}

message DisconnectRequest {}

message DisconnectResponse {}

// ============================================================
// Service
// ============================================================

// InstagramService manages per-user Instagram Story publishing connections.
service InstagramService {
  // GetStatus returns feature availability plus this user's connection state.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // GetAuthorizeUrl returns the Instagram OAuth URL to start the connect flow.
  rpc GetAuthorizeUrl(GetAuthorizeUrlRequest) returns (GetAuthorizeUrlResponse);
  // Disconnect removes this user's stored Instagram credentials.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  // GetMetaApp returns this user's registered Meta app (never the secret).
  rpc GetMetaApp(GetMetaAppRequest) returns (GetMetaAppResponse);
  // SaveMetaApp stores/updates the client's own Meta app credentials.
  rpc SaveMetaApp(SaveMetaAppRequest) returns (SaveMetaAppResponse);
  // DeleteMetaApp removes the client's Meta app registration.
  rpc DeleteMetaApp(DeleteMetaAppRequest) returns (DeleteMetaAppResponse);
  // GetAIConfig returns this client's AI reply configuration.
  rpc GetAIConfig(GetAIConfigRequest) returns (GetAIConfigResponse);
  // SaveAIConfig stores it.
  rpc SaveAIConfig(SaveAIConfigRequest) returns (SaveAIConfigResponse);
  // GetActivity lists received events and the replies sent.
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
}
