syntax = "proto3";

package affiliates.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/automatiza/proto/affiliates/v1;affiliatesv1";

// ============================================================
// Enums
// ============================================================

/**
 * Supported affiliate store types.
 */
enum AffiliateStore {
  AFFILIATE_STORE_UNSPECIFIED = 0;
  AFFILIATE_STORE_SHOPEE = 1;
  AFFILIATE_STORE_AMAZON = 2;
  AFFILIATE_STORE_MAGALU = 3;
  AFFILIATE_STORE_MERCADO_LIVRE = 4;
  AFFILIATE_STORE_SHEIN = 5;
  AFFILIATE_STORE_ALIEXPRESS = 6;
  AFFILIATE_STORE_AWIN = 7;
}

// ============================================================
// Messages
// ============================================================

/**
 * Represents affiliate credentials for a store.
 */
message AffiliateCredential {
  // Unique identifier
  string id = 1;

  // User who owns these credentials
  string user_id = 2;

  // Store type
  AffiliateStore store = 3;

  // Credentials data (JSON object)
  string credentials = 4;

  // Whether to auto-generate affiliate links
  bool auto_generate = 5;

  // Whether the credentials are active
  bool is_active = 6;

  // Creation timestamp (ISO 8601)
  string created_at = 7;

  // Last update timestamp (ISO 8601)
  string updated_at = 8;
}

/**
 * Store with active credentials summary.
 */
message ActiveStore {
  // Store type
  AffiliateStore store = 1;

  // Whether credentials are configured
  bool is_configured = 2;

  // Whether auto-generate is enabled
  bool auto_generate = 3;
}

// ============================================================
// List Credentials
// ============================================================

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated AffiliateCredential credentials = 1;
}

// ============================================================
// Get Credential
// ============================================================

message GetCredentialRequest {
  AffiliateStore store = 1;
}

message GetCredentialResponse {
  optional AffiliateCredential credential = 1;
}

// ============================================================
// Create/Update Credential
// ============================================================

message UpsertCredentialRequest {
  AffiliateStore store = 1;
  // Credentials data (JSON object)
  string credentials = 2 [(buf.validate.field).string.min_len = 2];
  optional bool auto_generate = 3;
  optional bool is_active = 4;
}

message UpsertCredentialResponse {
  AffiliateCredential credential = 1;
}

// ============================================================
// Delete Credential
// ============================================================

message DeleteCredentialRequest {
  AffiliateStore store = 1;
}

message DeleteCredentialResponse {}

// ============================================================
// List Active Stores
// ============================================================

message ListActiveStoresRequest {}

message ListActiveStoresResponse {
  repeated ActiveStore stores = 1;
}

// ============================================================
// Service Definition
// ============================================================

/**
 * AffiliateCredentialsService provides operations for managing affiliate credentials.
 */
service AffiliateCredentialsService {
  // Lists all affiliate credentials for the authenticated user.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);

  // Gets credentials for a specific store.
  rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse);

  // Creates or updates credentials for a store.
  rpc UpsertCredential(UpsertCredentialRequest) returns (UpsertCredentialResponse);

  // Deletes credentials for a store.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);

  // Lists all stores with active credentials.
  rpc ListActiveStores(ListActiveStoresRequest) returns (ListActiveStoresResponse);
}
