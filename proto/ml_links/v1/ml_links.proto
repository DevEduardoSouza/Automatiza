syntax = "proto3";

package ml_links.v1;

import "buf/validate/validate.proto";
import "common/v1/pagination.proto";

option go_package = "github.com/automatiza/proto/ml_links/v1;mllinksv1";

// ============================================================
// Messages
// ============================================================

/**
 * Represents a Mercado Livre link list.
 */
message MlLinkList {
  // Unique identifier
  string id = 1;

  // User who owns this list
  string user_id = 2;

  // List name
  string name = 3;

  // Optional description
  optional string description = 4;

  // Whether the list is active
  bool is_active = 5;

  // Creation timestamp (ISO 8601)
  string created_at = 6;

  // Last update timestamp (ISO 8601)
  string updated_at = 7;
}

/**
 * Represents an item in a Mercado Livre link list.
 */
message MlLinkListItem {
  // Unique identifier
  string id = 1;

  // Parent list ID
  string list_id = 2;

  // Original product URL
  string origin_url = 3;

  // Order index for sorting
  int32 order_index = 4;

  // Whether the item is active
  bool is_active = 5;

  // Timestamp when item was consumed (ISO 8601)
  optional string consumed_at = 6;

  // Automation ID that consumed this item
  optional string consumed_by_automation_id = 7;

  // Group ID that received this item
  optional string consumed_by_group_id = 8;

  // Product title from preview
  optional string product_title = 9;

  // Product price from preview
  optional double product_price = 10;

  // Product image URL from preview
  optional string product_image_url = 11;

  // Additional metadata (JSON)
  optional string metadata = 12;

  // Creation timestamp (ISO 8601)
  string created_at = 13;

  // Last update timestamp (ISO 8601)
  string updated_at = 14;
}

// ============================================================
// List ML Link Lists
// ============================================================

message ListMlLinkListsRequest {}

message ListMlLinkListsResponse {
  repeated MlLinkList lists = 1;
}

// ============================================================
// Get ML Link List
// ============================================================

message GetMlLinkListRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMlLinkListResponse {
  MlLinkList list = 1;
}

// ============================================================
// Create ML Link List
// ============================================================

message CreateMlLinkListRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional string description = 2;
  optional bool is_active = 3;
}

message CreateMlLinkListResponse {
  MlLinkList list = 1;
}

// ============================================================
// Update ML Link List
// ============================================================

message UpdateMlLinkListRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional string name = 2 [(buf.validate.field).string.max_len = 255];
  optional string description = 3;
  optional bool is_active = 4;
}

message UpdateMlLinkListResponse {
  MlLinkList list = 1;
}

// ============================================================
// Delete ML Link List
// ============================================================

message DeleteMlLinkListRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteMlLinkListResponse {}

// ============================================================
// List ML Link List Items
// ============================================================

message ListMlLinkListItemsRequest {
  string list_id = 1 [(buf.validate.field).string.min_len = 1];
  // Optional pagination parameters
  common.v1.PaginationRequest pagination = 2;
}

message ListMlLinkListItemsResponse {
  repeated MlLinkListItem items = 1;
  // Pagination metadata
  common.v1.PaginationResponse pagination = 2;
}

// ============================================================
// Create ML Link List Item
// ============================================================

message CreateMlLinkListItemRequest {
  string list_id = 1 [(buf.validate.field).string.min_len = 1];
  string origin_url = 2 [(buf.validate.field).string.min_len = 1];
  optional int32 order_index = 3;
  optional bool is_active = 4;
  optional string product_title = 5;
  optional double product_price = 6;
  optional string product_image_url = 7;
  optional string metadata = 8;
}

message CreateMlLinkListItemResponse {
  MlLinkListItem item = 1;
}

// ============================================================
// Bulk Create ML Link List Items
// ============================================================

message BulkCreateMlLinkListItemsRequest {
  string list_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string origin_urls = 2 [(buf.validate.field).repeated.min_items = 1];
  optional int32 base_order_index = 3;
}

message BulkCreateMlLinkListItemsResponse {
  int32 created_count = 1;
  repeated MlLinkListItem items = 2;
  // Number of URLs skipped (duplicates or invalid)
  int32 skipped_count = 3;
  // List of URLs that were skipped
  repeated string skipped_urls = 4;
}

// ============================================================
// Update ML Link List Item
// ============================================================

message UpdateMlLinkListItemRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional bool is_active = 2;
  optional int32 order_index = 3;
}

message UpdateMlLinkListItemResponse {
  MlLinkListItem item = 1;
}

// ============================================================
// Delete ML Link List Item
// ============================================================

message DeleteMlLinkListItemRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteMlLinkListItemResponse {}

// ============================================================
// Reset Consumed Items
// ============================================================

message ResetConsumedItemsRequest {
  string list_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ResetConsumedItemsResponse {
  int32 reset_count = 1;
}

// ============================================================
// Reorder Items
// ============================================================

message ReorderItemsRequest {
  string list_id = 1 [(buf.validate.field).string.min_len = 1];
  // Map of item ID to new order index
  map<string, int32> order_map = 2;
}

message ReorderItemsResponse {}

// ============================================================
// Service Definition
// ============================================================

/**
 * MlLinksService provides operations for managing Mercado Livre link lists.
 */
service MlLinksService {
  // Lists all ML link lists for the authenticated user.
  rpc ListMlLinkLists(ListMlLinkListsRequest) returns (ListMlLinkListsResponse);

  // Gets a specific ML link list by ID.
  rpc GetMlLinkList(GetMlLinkListRequest) returns (GetMlLinkListResponse);

  // Creates a new ML link list.
  rpc CreateMlLinkList(CreateMlLinkListRequest) returns (CreateMlLinkListResponse);

  // Updates an existing ML link list.
  rpc UpdateMlLinkList(UpdateMlLinkListRequest) returns (UpdateMlLinkListResponse);

  // Deletes an ML link list and all its items.
  rpc DeleteMlLinkList(DeleteMlLinkListRequest) returns (DeleteMlLinkListResponse);

  // Lists all items in an ML link list.
  rpc ListMlLinkListItems(ListMlLinkListItemsRequest) returns (ListMlLinkListItemsResponse);

  // Creates a new item in an ML link list.
  rpc CreateMlLinkListItem(CreateMlLinkListItemRequest) returns (CreateMlLinkListItemResponse);

  // Creates multiple items in an ML link list.
  rpc BulkCreateMlLinkListItems(BulkCreateMlLinkListItemsRequest) returns (BulkCreateMlLinkListItemsResponse);

  // Updates an item in an ML link list.
  rpc UpdateMlLinkListItem(UpdateMlLinkListItemRequest) returns (UpdateMlLinkListItemResponse);

  // Deletes an item from an ML link list.
  rpc DeleteMlLinkListItem(DeleteMlLinkListItemRequest) returns (DeleteMlLinkListItemResponse);

  // Resets all consumed items in a list.
  rpc ResetConsumedItems(ResetConsumedItemsRequest) returns (ResetConsumedItemsResponse);

  // Reorders items in a list.
  rpc ReorderItems(ReorderItemsRequest) returns (ReorderItemsResponse);
}
