# =============================================================================
# SonarQube Configuration - Golang Backend
# =============================================================================
# Stack: Go 1.24 + Gin + Connect-RPC + PostgreSQL + WAHA Plus (GOWS)
# Quality Gates: Aggressive enterprise settings
# =============================================================================

# Project identification
sonar.projectKey=automatiza-go
sonar.projectName=Automatiza - Go Backend
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=.
sonar.exclusions=\
  **/vendor/**,\
  **/*_test.go,\
  **/testdata/**,\
  **/mocks/**,\
  **/internal/gen/**,\
  **/*.pb.go,\
  **/*.connect.go,\
  **/scripts/**,\
  **/bin/**

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**,**/internal/gen/**

# Go coverage report (generated by go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Go test report (generated by go test -json)
sonar.go.tests.reportPaths=test-report.json

# golangci-lint integration
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# =============================================================================
# AGGRESSIVE QUALITY GATES FOR GOLANG
# =============================================================================
# These thresholds are enforced in SonarQube Quality Gate configuration
# See scripts/sonarqube/setup-quality-gates.sh for automated setup
#
# NEW CODE THRESHOLDS (must meet ALL):
# - Coverage on New Code: >= 80%
# - Duplicated Lines on New Code: <= 3%
# - Maintainability Rating: A
# - Reliability Rating: A
# - Security Rating: A
# - Security Hotspots Reviewed: 100%
# - Blocker Issues: 0
# - Critical Issues: 0
#
# OVERALL CODE THRESHOLDS:
# - Coverage: >= 70%
# - Duplicated Lines: <= 5%
# - Maintainability Rating: A (Technical Debt Ratio < 5%)
# - Reliability Rating: A (0 bugs)
# - Security Rating: A (0 vulnerabilities)
# =============================================================================

# Analysis metadata
sonar.links.homepage=https://github.com/brunovilefort/automatiza
sonar.links.ci=https://github.com/brunovilefort/automatiza/actions
sonar.links.issue=https://github.com/brunovilefort/automatiza/issues

# =============================================================================
# Golang specific rules
# =============================================================================

# Cognitive complexity threshold (aggressive)
sonar.go.cognitivecomplexity.threshold=15

# Cyclomatic complexity threshold (aggressive)
sonar.go.cyclomaticcomplexity.threshold=10

# Maximum function lines
sonar.go.maxFunctionLines=50

# =============================================================================
# Security-focused analysis (OWASP)
# =============================================================================
# - SQL Injection
# - Command Injection
# - Path Traversal
# - Hardcoded credentials
# - Weak cryptography
# - Insecure TLS
# - Error handling issues
# =============================================================================

# =============================================================================
# Integration with golangci-lint
# =============================================================================
# golangci-lint provides additional analysis that SonarQube imports:
# - gosec (security)
# - errcheck (error handling)
# - bodyclose (HTTP body close)
# - cyclop/gocognit (complexity)
# - staticcheck (bugs)
# =============================================================================
