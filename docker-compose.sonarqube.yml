# =============================================================================
# SonarQube Community Edition - Docker Compose
# =============================================================================
# Stack: React 19 + Golang/Gin + WAHA Plus (GOWS) + PostgreSQL + gRPC/Protobuf
# Quality Gates: Aggressive settings for enterprise-grade code quality
# =============================================================================

services:
  # ===========================================================================
  # SonarQube Server
  # ===========================================================================
  sonarqube:
    image: sonarqube:10.7-community
    container_name: automatiza-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      # Database
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube_password}
      # JVM Settings (tune for your machine)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # Web context (optional)
      SONAR_WEB_CONTEXT: /sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonarqube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/sonarqube/api/system/status | grep -q 'UP'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # Required sysctl settings for Elasticsearch
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ===========================================================================
  # SonarQube PostgreSQL Database
  # ===========================================================================
  sonarqube-db:
    image: postgres:16-alpine
    container_name: automatiza-sonarqube-db
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube_password}
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER:-sonarqube} -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sonarqube-network:
    driver: bridge

volumes:
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_db_data:
    driver: local
